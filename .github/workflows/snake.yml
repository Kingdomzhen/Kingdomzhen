name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: generate snake svg
        run: python .github/scripts/generate_snake.py

      - name: commit svg to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake
          if git diff --cached --quiet; then
            echo "snake svg unchanged"
          else
            git commit -m "chore: regenerate contribution snake"
            git push origin HEAD:main
          fi
